<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دُربة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="دُربة: تعلم إكسل والبيفوت تيبل، وورد وبوربوينت، واستعد لاختبار ستيب بدروس قصيرة واختبارات.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: sticky brand bar + centered 920px column. Home = dashboard of progress + tracks + tools; track pages = header band, tab strip, content. Quiz/mock take the whole column. */
:root{
  --bg:#E8ECEA; --surface:#F3F6F4; --surface-2:#E1E7E4; --line:#CBD4D0;
  --fg:#1C272A; --muted:#55646A;
  --accent:#1D6E58; --accent-soft:#D2E5DD;
  --xl:#1D6E58; --wd:#2A5DA8; --pp:#B4532F; --st:#6A4CA3; --gold:#9A6B12;
  --ok:#1F7A45; --ok-soft:#D5EBDD; --bad:#B23A3A; --bad-soft:#F2DADA;
  --shadow:0 1px 2px rgba(28,39,42,.06),0 6px 20px rgba(28,39,42,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A1C; --surface:#1A2225; --surface-2:#222C30; --line:#2E3A3E;
  --fg:#DCE4E1; --muted:#98A7A3;
  --accent:#5DBB98; --accent-soft:#1E3830;
  --xl:#5DBB98; --wd:#7FA7E6; --pp:#E59272; --st:#AE93E0; --gold:#E2B65C;
  --ok:#6CCB8E; --ok-soft:#1C3426; --bad:#EE8A8A; --bad-soft:#3D2324;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131A1C; --surface:#1A2225; --surface-2:#222C30; --line:#2E3A3E;
  --fg:#DCE4E1; --muted:#98A7A3;
  --accent:#5DBB98; --accent-soft:#1E3830;
  --xl:#5DBB98; --wd:#7FA7E6; --pp:#E59272; --st:#AE93E0; --gold:#E2B65C;
  --ok:#6CCB8E; --ok-soft:#1C3426; --bad:#EE8A8A; --bad-soft:#3D2324;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.8;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
kbd,code{font-family:var(--f-mono);font-size:.82em;direction:ltr;unicode-bidi:isolate;display:inline-block}
kbd{background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 .45em;line-height:1.6}
code{background:var(--surface-2);border-radius:6px;padding:0 .4em}
.en{direction:ltr;unicode-bidi:isolate}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;text-decoration:none;color:var(--fg)}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2;margin-top:2px}
.theme{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;display:flex;gap:6px;align-items:center}
.theme svg{width:16px;height:16px}
nav.main{display:flex;gap:2px;overflow-x:auto;width:100%;scrollbar-width:none;margin-top:6px}
nav.main a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px 10px;font-size:.92rem;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
nav.main a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
nav.main .cnt{background:var(--bad);color:var(--bg);border-radius:99px;font-size:.7rem;padding:0 6px;line-height:1.5}

main{max-width:920px;margin:0 auto;padding-block:26px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:22px}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.small{font-size:.85rem;color:var(--muted)}
.note{font-size:.9rem;color:var(--muted);margin:0}
.tag{font-size:.78rem;letter-spacing:.02em;font-weight:600;color:var(--sec,var(--accent))}
.h2{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.85rem}

/* home */
.hero{display:grid;gap:8px}
.hero h1{font-size:clamp(1.7rem,4.8vw,2.5rem)}
.hero h1 em{font-style:normal;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.82rem;color:var(--muted)}
.continue{display:flex;gap:14px;align-items:center;background:var(--accent);color:var(--bg);border-radius:var(--r);padding:14px 18px;text-decoration:none;box-shadow:var(--shadow)}
.continue div{flex:1;min-width:0}
.continue small{opacity:.85;display:block}
.continue b{font-family:var(--f-display);font-size:1.05rem}
.continue .go{font-size:1.4rem}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.track{display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.track:hover{transform:translateY(-2px);border-color:var(--sec)}
.ico{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--sec) 14%,transparent);color:var(--sec);display:grid;place-items:center}
.ico svg{width:24px;height:24px}
.track h2{font-size:1.15rem}
.track p{margin:0;color:var(--muted);font-size:.93rem}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--sec,var(--accent));width:0;transition:width .3s}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tool{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tool:hover{border-color:var(--sec)}
.tool .ico{width:38px;height:38px;flex:0 0 38px}
.tool div{min-width:0}
.tool b{font-family:var(--f-display);display:block;font-size:.98rem}
.tool small{color:var(--muted);font-size:.82rem}
.foot{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px 20px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* track header + tabs */
.thead{display:flex;gap:14px;align-items:flex-start}
.thead .ico{width:52px;height:52px;flex:0 0 52px}
.thead .ico svg{width:28px;height:28px}
.thead>div{flex:1;min-width:0}
.thead h1{font-size:clamp(1.5rem,4.2vw,2.1rem)}
.tprog{display:flex;gap:10px;align-items:center;margin-top:10px}
.tprog .meter{flex:1;max-width:260px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:10px}
.subtabs button{flex:0 0 auto;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--sec);border-color:var(--sec);color:var(--bg)}
.group-title{font-size:1.05rem;color:var(--sec);margin-top:6px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.group-title small{font-family:var(--f-body);color:var(--muted);font-weight:500;font-size:.82rem}

/* lessons */
.lessons{display:grid;gap:10px}
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:130px}
details.lesson[open]{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--sec) 40%,var(--line))}
details.lesson summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;font-family:var(--f-display);font-weight:600}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary .n{flex:0 0 30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--sec);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
details.lesson summary .t{flex:1;min-width:0}
details.lesson summary .chev{transition:transform .2s;color:var(--muted)}
details.lesson[open] summary .chev{transform:rotate(-90deg)}
details.lesson.done summary .n{background:var(--sec);color:var(--bg)}
.lbody{padding:0 18px 16px;display:grid;gap:12px;min-width:0}
.lbody ul{margin:0;padding-inline-start:1.2em;display:grid;gap:4px}
.lbody p{margin:0}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.95rem}
.ex{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:.95rem;overflow-x:auto}
.ex b{font-family:var(--f-display)}
.lfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.mark{font-size:.88rem;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 16px;cursor:pointer}
.done .mark{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nextl{font-size:.88rem;border:0;background:var(--sec);color:var(--bg);border-radius:999px;padding:5px 16px;cursor:pointer}
.keys{width:100%;border-collapse:collapse;font-size:.95rem}
.keys td,.keys th{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
.keys th{font-family:var(--f-display);font-weight:600;color:var(--sec);font-size:.88rem}
.keys td:first-child{white-space:nowrap;width:1%;padding-inline-end:14px}
.scroll{overflow-x:auto}

/* demo */
.demo,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.demo h3,.panel h3{font-size:1.05rem}
.demo .row{display:flex;gap:14px;flex-wrap:wrap;align-items:start}
.demo .col{flex:1 1 260px;min-width:0}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrls label{display:grid;gap:2px;font-size:.85rem;color:var(--muted)}
select,input[type=search]{font:inherit;font-size:.95rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
input[type=search]{width:100%;max-width:340px}
table.grid{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 8px;text-align:start}
table.grid th{background:var(--surface-2);font-weight:600}
table.grid tr.total td{font-weight:700;background:var(--accent-soft)}

/* buttons */
.btn{font-weight:600;border:0;background:var(--sec,var(--accent));color:var(--bg);border-radius:10px;padding:9px 18px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}

/* quiz list */
.quizlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.qcard h3{font-size:1.02rem}
.qcard .btn{justify-self:start}
.badge{display:inline-block;font-size:.75rem;border-radius:99px;padding:1px 10px;background:var(--surface-2);color:var(--muted)}
.badge.good{background:var(--ok-soft);color:var(--ok)}
.badge.mid{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.badge.low{background:var(--bad-soft);color:var(--bad)}

/* quiz runner */
.runhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 0;font-size:.92rem}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qq{font-family:var(--f-display);font-weight:600;font-size:1.12rem}
.qq .en{display:block;font-family:var(--f-body);font-weight:500;margin-top:6px;text-align:left;font-size:1.05rem}
.passage{direction:ltr;text-align:left;unicode-bidi:isolate;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.98rem;line-height:1.75}
.opts{display:grid;gap:8px}
.opt{text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:.78rem;font-family:var(--f-mono)}
.opt .o{flex:1;min-width:0}
.opt .o.en{text-align:left}
.opt:hover:not(:disabled){border-color:var(--sec)}
.opt.picked{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 10%,var(--bg))}
.opt.picked .k{background:var(--sec);color:var(--bg)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:var(--bg)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.explain{border-inline-start:3px solid var(--sec);padding-inline-start:12px;font-size:.95rem}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--sec);font-variant-numeric:tabular-nums;line-height:1.1}
.ring{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.reviewlist{display:grid;gap:10px}
.rv{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.93rem;display:grid;gap:4px}
.rv .en{text-align:left}
.rv .ans{color:var(--ok);font-weight:600}
.rv .yours{color:var(--bad)}
.hint{font-size:.78rem;color:var(--muted)}

/* mock */
.mockbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.timer{font-family:var(--f-mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr}
.timer.low{color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:4px}
.palette button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:.75rem;cursor:pointer;font-variant-numeric:tabular-nums}
.palette button.ans{background:var(--sec);color:var(--bg);border-color:var(--sec)}
.palette button.cur{outline:2px solid var(--fg);outline-offset:1px}
.secbars{display:grid;gap:10px}
.secbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
.secbar .meter{height:10px}
.secbar b{font-variant-numeric:tabular-nums;text-align:end}
.confirm{background:var(--bad-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* vocab */
.card{perspective:1000px;cursor:pointer;min-height:270px}
.card-in{position:relative;min-height:270px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;align-content:center;gap:8px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .w{font-family:var(--f-display);font-size:2.1rem;font-weight:600;direction:ltr}
.face .m{font-family:var(--f-display);font-size:1.6rem;color:var(--sec)}
.face .s{direction:ltr;color:var(--muted);font-size:.98rem}
.vlist td{font-size:.93rem}
.vlist td .en{font-weight:600}
.known{color:var(--ok)}
.face .p{color:var(--sec);font-size:1.2rem;font-weight:600;direction:rtl}
.say{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.spk{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:3px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:5px;align-items:center;line-height:1.6}
.spk:hover{border-color:var(--sec)}
.spk.ic{padding:1px 8px;font-size:.8rem;vertical-align:middle}
.card .face.back,.card.flip .face:not(.back){pointer-events:none}
.card.flip .face.back{pointer-events:auto}
.vnav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.vlist .vp{color:var(--sec);font-size:.85rem}

/* practice */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .num{flex:0 0 28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--sec);display:grid;place-items:center;font-size:.82rem;font-weight:600}
.task>div{flex:1;min-width:0;display:grid;gap:4px}
.task details summary{cursor:pointer;color:var(--sec);font-size:.88rem;font-weight:600}
.task details>div{margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{margin-top:6px;accent-color:var(--sec);width:18px;height:18px;flex:0 0 18px}
.check.on span{color:var(--muted);text-decoration:line-through}
textarea.raw{width:100%;height:120px;font-family:var(--f-mono);font-size:.8rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;direction:ltr}

/* refs + cheat */
.refs{display:grid;gap:10px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;gap:4px}
.ref a{font-family:var(--f-display);font-weight:600;text-decoration:none}
.ref a:hover{text-decoration:underline}
.ref p{margin:0;font-size:.95rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 10px}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.howto ol{margin:8px 0 0;padding-inline-start:1.2em;display:grid;gap:4px}
.cheats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.cheat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.cheat h3{font-size:1rem;color:var(--sec)}
.cheat ol,.cheat ul{margin:0;padding-inline-start:1.2em;display:grid;gap:3px;font-size:.93rem}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec b{font-family:var(--f-display);font-size:1.6rem;color:var(--sec);display:block;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center}

   {t:'التصميم السريع',f:['ppMaster'],s:[['Microsoft',MS_MASTER],['GCFGlobal/LearnFree',LF_PP]],x:`<ul><li>عدّل الشريحة الرئيسية <b>قبل</b> ما تبدأ تسوي الشرائح، أسهل لك.</li><li>شعار ما يرضى ينحذف أو يتحرك؟ غالباً موجود في الشريحة الرئيسية. روح View ← Slide Master واحذفه من هناك.</li></ul>`,b:`<ul>

step:{
  name:'اختبار ستيب STEP', color:'--st',
  blurb:'قواعد بأمثلة، قراءة واستماع، كلمات، واختبار تجريبي بوقت.',
  intro:'اختبار كفايات اللغة الإنجليزية من هيئة تقويم التعليم والتدريب (قياس). كل قاعدة هنا بسطر شرح وأمثلة وفخ شائع، وبعدها أسئلة تغطيها.',
  path:[['افهم','اقرأ دروس القواعد هنا بالترتيب، درسين أو ثلاثة يومياً.'],['تدرّب','حل اختبار القواعد اللي يغطي الدروس اللي خلصتها، واقرأ شرح كل غلطة.'],['عمّق','English Grammar in Use للقواعد، و6 Minute English من BBC للاستماع، وLearnEnglish للقراءة.'],['حاكِ الاختبار','في آخر أسبوعين: نماذج وتجميعات بوقت، ودفتر للأخطاء.']],
  groups:[
  {title:'اعرف الاختبار', lessons:[
   {t:'وش هو ستيب؟',b:`<ul>
     <li>اختبار يقيس مستواك في الإنجليزي، تقدمه <b>هيئة تقويم التعليم والتدريب (قياس)</b>.</li>
     <li>الدرجة من <b>100</b>. الدرجة المطلوبة تختلف حسب الجهة (جامعة، ابتعاث، وظيفة)، فاسألهم عنها.</li>
     <li>كل الأسئلة <b>اختيار من متعدد</b>، وفيه أسئلة تجريبية ما تنحسب بالدرجة.</li>
     <li>التسجيل والمواعيد والرسوم من موقع الهيئة الرسمي فقط (الرابط في المراجع).</li></ul>`},
   {t:'الأقسام الأربعة ووزنها',b:`<div class="sections">
     <div class="sec"><b>40%</b>فهم المقروء<div class="small">Reading</div></div>
     <div class="sec"><b>30%</b>التراكيب (القواعد)<div class="small">Structure</div></div>
     <div class="sec"><b>20%</b>فهم المسموع<div class="small">Listening</div></div>
     <div class="sec"><b>10%</b>التحليل الكتابي<div class="small">Compositional Analysis</div></div></div>
     <div class="tip">يعني <b>القراءة والقواعد = 70%</b> من درجتك. ركّز وقتك عليهم أول.</div>`},
   {t:'أهم رموز الشرح',b:`<div class="scroll"><table class="keys">
     <tr><td><b>V1</b></td><td>الفعل في أصله: go, write, eat</td></tr>
     <tr><td><b>V2</b></td><td>الماضي: went, wrote, ate</td></tr>
     <tr><td><b>V3</b></td><td>التصريف الثالث: gone, written, eaten</td></tr>
     <tr><td><b>V-ing</b></td><td>الفعل مع ing: going, writing</td></tr></table></div>
     <div class="tip">الأفعال المنتظمة تاخذ ed في V2 وV3 (played). والشاذة لازم تحفظها: go, went, gone.</div>`}
  ]},
  {title:'القواعد (Structure): 30%', lessons:[
   {t:'المضارع البسيط والمستمر',b:`${R('<b>البسيط</b> للعادة والحقيقة: <span class="en">V1 (+s مع he/she/it)</span><br><b>المستمر</b> لشي يصير الحين: <span class="en">am/is/are + V-ing</span>')}
     ${E('She <u>drinks</u> coffee every morning.','تشرب قهوة كل صباح (عادة)')}
     ${E('Water <u>boils</u> at 100°C.','الماء يغلي عند 100 (حقيقة)')}
     ${E('Look! The kids <u>are playing</u> outside.','شوف! العيال يلعبون برا (الحين)')}
     <p><b>كلمات تدلك:</b> البسيط: <span class="en">every day, usually, always, never</span> · المستمر: <span class="en">now, look!, at the moment</span></p>
     <div class="tip"><b>فخ:</b> لا تنسى s مع he/she/it: <span class="en">He <s>go</s> → He <b>goes</b></span></div>`},
   {t:'الماضي البسيط والمستمر',b:`${R('<b>البسيط</b> لحدث خلص: <span class="en">V2</span><br><b>المستمر</b> لحدث كان شغال: <span class="en">was/were + V-ing</span>')}
     ${E('I <u>visited</u> Abha last summer.','زرت أبها الصيف اللي فات')}
     ${E('I <u>was watching</u> TV when the phone <u>rang</u>.','كنت أشوف التلفزيون لما رن الجوال')}
     <p><b>القاعدة الذهبية:</b> الحدث الطويل = مستمر، والحدث القصير اللي قطعه = بسيط. وبعد <span class="en">while</span> غالباً المستمر.</p>
     <p><b>كلمات تدلك:</b> <span class="en">yesterday, last week, ago, in 2010</span></p>`},
   {t:'المضارع التام',b:`${R('<span class="en">have/has + V3</span><br>لشي بدأ في الماضي ومستمر لين الحين، أو خبرة بدون وقت محدد')}
     ${E('I <u>have lived</u> here <u>since</u> 2015.','ساكن هنا من 2015 (ولين الحين)')}
     ${E('She <u>has worked</u> here <u>for</u> five years.','تشتغل هنا من خمس سنين')}
     ${E('Have you <u>ever been</u> to Japan?','قد رحت اليابان؟')}
     <div class="scroll"><table class="keys">
     <tr><td><span class="en">since</span></td><td>مع بداية الوقت: since 2015, since Monday</td></tr>
     <tr><td><span class="en">for</span></td><td>مع المدة: for 5 years, for two hours</td></tr>
     <tr><td><span class="en">already</span></td><td>خلاص صار (في الإثبات)</td></tr>
     <tr><td><span class="en">yet</span></td><td>للحين (في النفي والسؤال، آخر الجملة)</td></tr>
     <tr><td><span class="en">just</span></td><td>توه صار</td></tr></table></div>
     <div class="tip"><b>فخ:</b> لو فيه وقت ماضي محدد (yesterday, last year) استخدم الماضي البسيط مو التام.</div>`},
   {t:'الماضي التام والمستقبل',b:`${R('<b>الماضي التام:</b> <span class="en">had + V3</span>، للحدث الأقدم من حدثين في الماضي<br><b>المستقبل:</b> <span class="en">will + V1</span> أو <span class="en">am/is/are going to + V1</span>')}
     ${E('When we arrived, the movie <u>had started</u>.','لما وصلنا، الفيلم كان قد بدأ (بدأ قبل وصولنا)')}
     ${E('<u>By the time</u> he called, I <u>had left</u>.','لما اتصل، كنت قد طلعت')}
     ${E('I think it <u>will rain</u> tomorrow.','أتوقع بكرة تمطر')}
     ${E('We <u>are going to</u> travel next week.','بنسافر الأسبوع الجاي (خطة)')}
     <div class="tip"><b>دليل قوي:</b> <span class="en">by the time + ماضي</span> = غالباً الماضي التام في الجزء الثاني.</div>`},
   {t:'توافق الفعل مع الفاعل',b:`${R('الفاعل مفرد ← فعل مفرد (is, was, has, goes). الفاعل جمع ← فعل جمع (are, were, have, go)')}
     <div class="scroll"><table class="keys">
     <tr><td><span class="en">Each / Every + مفرد</span></td><td><span class="en">Each student <u>has</u> a book.</span></td></tr>
     <tr><td><span class="en">One of the + جمع</span></td><td>الفعل مفرد: <span class="en">One of my friends <u>lives</u> here.</span></td></tr>
     <tr><td><span class="en">The number of</span></td><td>مفرد: <span class="en">The number of cars <u>is</u> rising.</span></td></tr>
     <tr><td><span class="en">A number of</span></td><td>جمع (يعني عدد من): <span class="en">A number of cars <u>are</u> parked.</span></td></tr>
     <tr><td><span class="en">There is / There are</span></td><td>حسب اللي بعدها: <span class="en">There <u>are</u> many people.</span></td></tr>
     <tr><td><span class="en">Neither…nor / Either…or</span></td><td>الفعل يتبع الأقرب: <span class="en">Neither he nor his friends <u>were</u> there.</span></td></tr></table></div>
     <div class="tip"><b>فخ:</b> لا تنخدع بالكلام اللي بين الفاعل والفعل: <span class="en">The box <i>of apples</i> <b>is</b> heavy.</span> الفاعل box مفرد.</div>`},
   {t:'المبني للمجهول (Passive)',b:`${R('<span class="en">be + V3</span><br>نستخدمه لما يكون المهم الشي اللي صار، مو مين سواه')}
     ${E('Someone stole my car. → My car <u>was stolen</u>.','انسرقت سيارتي')}
     <div class="scroll"><table class="keys">
     <tr><td>مضارع</td><td><span class="en">English <u>is spoken</u> here.</span></td></tr>
     <tr><td>ماضي</td><td><span class="en">The letter <u>was written</u> yesterday.</span></td></tr>
     <tr><td>تام</td><td><span class="en">The work <u>has been done</u>.</span></td></tr>
     <tr><td>مستقبل</td><td><span class="en">The bridge <u>will be built</u> next year.</span></td></tr>
     <tr><td>مع modal</td><td><span class="en">It <u>must be finished</u> today.</span></td></tr></table></div>
     <div class="tip"><b>كيف تعرف إنه مجهول؟</b> لو الفاعل ما يقدر يسوي الفعل بنفسه (الرسالة ما تكتب نفسها) ← <span class="en">be + V3</span>. وغالباً بعده <span class="en">by</span>.</div>`},
   {t:'الجمل الشرطية (If)',b:`<div class="scroll"><table class="keys">
     <tr><td><b>0</b> حقيقة</td><td><span class="en">If + مضارع, مضارع</span><br><span class="en">If you heat ice, it <u>melts</u>.</span></td></tr>
     <tr><td><b>1</b> ممكن</td><td><span class="en">If + مضارع, will + V1</span><br><span class="en">If it rains, we <u>will stay</u> home.</span></td></tr>
     <tr><td><b>2</b> خيال</td><td><span class="en">If + ماضي, would + V1</span><br><span class="en">If I <u>were</u> rich, I <u>would travel</u>.</span></td></tr>
     <tr><td><b>3</b> ندم على الماضي</td><td><span class="en">If + had V3, would have V3</span><br><span class="en">If I <u>had studied</u>, I <u>would have passed</u>.</span></td></tr></table></div>
     <div class="tip"><b>فخين:</b> لا تحط <span class="en">will</span> بعد <span class="en">if</span> مباشرة. وفي النوع الثاني <span class="en">were</span> مع كل الضمائر: <span class="en">If he were</span>.</div>`},
   {t:'أسماء الوصل (who, which…)',b:`<div class="scroll"><table class="keys">
     <tr><td><span class="en">who</span></td><td>للعاقل: <span class="en">The man <u>who</u> called me…</span></td></tr>
     <tr><td><span class="en">which</span></td><td>لغير العاقل: <span class="en">The car <u>which</u> I bought…</span></td></tr>
     <tr><td><span class="en">that</span></td><td>للاثنين (بدون فاصلة)</td></tr>
     <tr><td><span class="en">whose</span></td><td>للملكية: <span class="en">The girl <u>whose</u> father is a doctor…</span></td></tr>
     <tr><td><span class="en">where</span></td><td>للمكان: <span class="en">The city <u>where</u> I was born…</span></td></tr>
     <tr><td><span class="en">when</span></td><td>للزمان: <span class="en">The day <u>when</u> we met…</span></td></tr></table></div>
     <div class="tip"><b>حيلة whose:</b> لو بعد الفراغ اسم يخص اللي قبله (سيارته، أبوها) ← <span class="en">whose</span>.</div>`},
   {t:'ing أو to؟',b:`${R('بعض الأفعال ياخذ بعدها <span class="en">V-ing</span>، وبعضها <span class="en">to + V1</span>. وبعد أي حرف جر دايماً <span class="en">V-ing</span>')}
     <div class="scroll"><table class="keys">
     <tr><td><b>+ ing</b></td><td><span class="en">enjoy, finish, avoid, mind, keep, suggest</span><br><span class="en">I enjoy <u>reading</u>.</span></td></tr>
     <tr><td><b>+ to</b></td><td><span class="en">want, decide, plan, hope, need, agree, refuse</span><br><span class="en">She decided <u>to study</u> abroad.</span></td></tr>
     <tr><td><b>بعد حرف جر</b></td><td><span class="en">interested in <u>learning</u>, good at <u>drawing</u>, before <u>leaving</u></span></td></tr></table></div>
     <div class="tip"><b>أشهر فخ:</b> <span class="en">look forward to <b>seeing</b></span> و<span class="en">be used to <b>waking</b></span>. الـ to هنا حرف جر فيجي بعدها ing.<br><span class="en">used to + V1</span> (بدون be) = كنت أسوي زمان: <span class="en">I used to <u>play</u> football.</span></div>`},
   {t:'المقارنة والتفضيل',b:`<div class="scroll"><table class="keys">
     <tr><td>كلمة قصيرة</td><td><span class="en">tall → taller than → the tallest</span></td></tr>
     <tr><td>كلمة طويلة</td><td><span class="en">beautiful → more beautiful than → the most beautiful</span></td></tr>
     <tr><td>شاذة</td><td><span class="en">good → better → the best · bad → worse → the worst</span></td></tr>
     <tr><td>مساواة</td><td><span class="en">as tall as</span> (بنفس الطول)</td></tr></table></div>
     ${E('Riyadh is <u>bigger than</u> Abha.','الرياض أكبر من أبها')}
     ${E('This is <u>the most interesting</u> book I have read.','هذا أمتع كتاب قريته')}
     <div class="tip"><b>فخ:</b> لا تجمعهم: <span class="en"><s>more better</s></span> غلط، والصح <span class="en">better</span>. ومع <span class="en">than</span> دايماً مقارنة، ومع <span class="en">the</span> غالباً تفضيل.</div>`},
   {t:'أدوات التعريف a / an / the',b:`${R('<span class="en">a</span> قبل <b>صوت</b> ساكن، و<span class="en">an</span> قبل <b>صوت</b> متحرك (a, e, i, o, u). المهم الصوت مو الحرف')}
     ${E('<u>an</u> hour · <u>an</u> honest man','الـ h ما تنطق، فالصوت متحرك')}
     ${E('<u>a</u> university · <u>a</u> European country','تنطق "يو"، فالصوت ساكن')}
     ${E('I saw <u>a</u> cat. <u>The</u> cat was black.','أول مرة a، وبعدها لما صار معروف the')}
     <div class="tip"><span class="en">the</span> مع الأشياء الوحيدة: <span class="en">the sun, the moon</span>، ومع التفضيل: <span class="en">the best</span>.</div>`},
   {t:'حروف الجر للوقت والمكان',b:`<div class="scroll"><table class="keys">
     <tr><td><span class="en">at</span></td><td>وقت دقيق ومكان محدد: <span class="en">at 5 o'clock, at night, at the door</span></td></tr>
     <tr><td><span class="en">on</span></td><td>أيام وتواريخ وسطح: <span class="en">on Monday, on 5 May, on the table</span></td></tr>
     <tr><td><span class="en">in</span></td><td>شهور وسنين وفترات ومكان مغلق: <span class="en">in July, in 2020, in the morning, in the room</span></td></tr></table></div>
     <p><b>تعابير ثابتة كثيرة في الاختبار:</b> <span class="en">good at, interested in, afraid of, depend on, listen to, different from, proud of</span></p>
     <div class="tip"><b>طريقة الحفظ:</b> من الصغير للكبير: at (ساعة) ← on (يوم) ← in (شهر وسنة).</div>`},
   {t:'الأفعال المساعدة (Modals)',b:`${R('<span class="en">can, could, must, should, may, might, will, would</span> + <b>V1 بدون to وبدون s</b>')}
     ${E('He <u>can swim</u>.','يقدر يسبح (مو can swims ولا can to swim)')}
     ${E('You <u>must wear</u> a seatbelt.','لازم تلبس الحزام')}
     ${E('You <u>should see</u> a doctor.','المفروض تروح للدكتور (نصيحة)')}
     ${E('It <u>might rain</u>.','يمكن تمطر (احتمال)')}`},
   {t:'ترتيب الكلام في السؤال غير المباشر',b:`${R('لما يكون السؤال داخل جملة، نرجع الترتيب عادي: الفاعل ثم الفعل')}
     ${E('Where <u>is the station</u>? → Can you tell me where <u>the station is</u>?','تقدر تقول لي وين المحطة؟')}
     ${E('What time <u>does it start</u>? → Do you know what time <u>it starts</u>?','تعرف متى يبدأ؟')}
     <div class="tip"><b>فخ:</b> بعد <span class="en">Do you know / Can you tell me</span> لا تقلب الفعل ولا تستخدم do/does.</div>`},
   {t:'أدوات الربط',b:`<div class="scroll"><table class="keys">
     <tr><td><span class="en">and, also, moreover</span></td><td>إضافة</td></tr>
     <tr><td><span class="en">but, however</span></td><td>تعارض (لكن)</td></tr>
     <tr><td><span class="en">although + جملة</span></td><td><span class="en">Although it was raining, we went out.</span></td></tr>
     <tr><td><span class="en">despite + اسم أو ing</span></td><td><span class="en">Despite the rain, we went out.</span></td></tr>
     <tr><td><span class="en">because + جملة</span></td><td><span class="en">because it was noisy</span></td></tr>
     <tr><td><span class="en">because of + اسم</span></td><td><span class="en">because of the noise</span></td></tr>
     <tr><td><span class="en">so, therefore</span></td><td>نتيجة (لذلك)</td></tr></table></div>
     <div class="tip"><b>الحيلة:</b> شوف وش بعد الفراغ. جملة فيها فعل؟ ← although / because. اسم بس؟ ← despite / because of.</div>`}
  ]},
  {title:'القراءة (Reading): 40%', lessons:[
   {t:'طريقة حل القطعة',b:`<ul>
     <li><b>1.</b> اقرأ <b>السؤال أول</b>، وحدد الكلمة المفتاحية فيه.</li>
     <li><b>2.</b> اقرأ القطعة قراءة سريعة عشان تعرف موضوعها.</li>
     <li><b>3.</b> دوّر على الكلمة المفتاحية في القطعة، واقرأ الجملة اللي قبلها واللي بعدها.</li>
     <li><b>4.</b> الجواب الصح غالباً <b>نفس المعنى بكلمات ثانية</b>، مو نفس الكلمات بالحرف.</li></ul>
     <div class="tip">خيار ينقل جملة من القطعة حرفياً بس يغير معناها؟ فخ مشهور.</div>`},
   {t:'أنواع الأسئلة الخمسة',b:`<div class="scroll"><table class="keys">
     <tr><td><b>الفكرة الرئيسية</b><br><span class="en">main idea / best title</span></td><td>وش تتكلم عنه القطعة كلها؟ ركز على أول فقرة وآخر فقرة. استبعد الخيار الضيق جداً (تفصيلة) والواسع جداً.</td></tr>
     <tr><td><b>تفصيلة</b><br><span class="en">according to the passage</span></td><td>الجواب مكتوب صراحة. دوّر عليه بالكلمة المفتاحية.</td></tr>
     <tr><td><b>معنى كلمة</b><br><span class="en">closest in meaning</span></td><td>جرّب كل خيار مكان الكلمة في الجملة، واختار اللي يحافظ على المعنى.</td></tr>
     <tr><td><b>الضمير يعود على</b><br><span class="en">"it" refers to</span></td><td>ارجع للخلف، غالباً أقرب اسم مناسب قبله (مفرد مع it، جمع مع they).</td></tr>
     <tr><td><b>استنتاج</b><br><span class="en">we can infer / the writer suggests</span></td><td>مو مكتوب حرفياً، لكن تقدر تفهمه من الكلام. لا تبالغ بالاستنتاج.</td></tr></table></div>`},
   {t:'مثال محلول',b:`<div class="passage">Dates are an important crop in Saudi Arabia. <b>They</b> are rich in sugar and fiber, and they can be stored for months without going bad. For this reason, travelers in the past depended on them during long journeys.</div>
     <ul><li><b>Main idea?</b> فوائد التمر وأهميته (مو "السفر قديماً"، هذي تفصيلة).</li>
     <li><b>"They" refers to?</b> <span class="en">dates</span>، أقرب اسم جمع قبلها.</li>
     <li><b>Why did travelers depend on dates?</b> لأنها تنحفظ شهور بدون ما تخرب (مكتوب صراحة).</li>
     <li><b>"depended on" closest to?</b> <span class="en">relied on</span>.</li></ul>`}
  ]},
  {title:'الاستماع والتحليل الكتابي', lessons:[
   {t:'الاستماع (20%)',b:`<ul>
     <li>اقرأ <b>السؤال والخيارات</b> قبل ما يبدأ الصوت، عشان تعرف وش تسمع له.</li>
     <li>انتبه لكلمات تقلب المعنى: <span class="en">but, actually, instead, unfortunately</span>. الجواب غالباً بعدها.</li>
     <li>خيار فيه كلمة سمعتها حرفياً مو شرط يكون الصح، فخ متكرر.</li>
     <li>فاتتك كلمة؟ كمّل، لا تعلق.</li>
     <li>تدرّب: 10 دقايق يومياً من 6 Minute English، اسمع مرة بدون نص ومرة مع النص.</li></ul>
     ${E('"I wanted the blue one, <u>but</u> they only had black, so I took it."','الجواب: أخذ الأسود (اللي بعد but)')}`},
   {t:'التحليل الكتابي (10%)',b:`<p>أسئلة عن جودة الكتابة. أشهر أنواعها:</p>
     <div class="scroll"><table class="keys">
     <tr><td><b>اكتشف الخطأ</b></td><td>جملة مقسمة A B C D وتختار الجزء الغلط. افحص: توافق الفعل، الزمن، الجمع والمفرد، حرف الجر.</td></tr>
     <tr><td><b>الجملة الصحيحة</b></td><td>أربع جمل وحدة بس سليمة قواعدياً.</td></tr>
     <tr><td><b>أداة الربط</b></td><td>تختار الكلمة اللي تربط جملتين: تعارض، سبب، نتيجة، إضافة.</td></tr>
     <tr><td><b>الترتيب</b></td><td>ترتب جمل لفقرة منطقية: الجملة العامة أول، والتفاصيل بعدها، والخاتمة آخر.</td></tr></table></div>
     ${E('The students (A) <u>was</u> studying...','الخطأ: was، والصح were لأن students جمع')}`}
  ]},
  {title:'خطة المذاكرة ويوم الاختبار', lessons:[
   {t:'خطة 4 أسابيع',b:`<div class="scroll"><table class="keys">
     <tr><td><b>الأسبوع 1</b></td><td>الأزمنة كلها + توافق الفعل + قطعة قراءة يومياً</td></tr>
     <tr><td><b>الأسبوع 2</b></td><td>المجهول، الشرطية، أسماء الوصل، ing/to، المقارنة، حروف الجر، أدوات الربط + استماع يومي</td></tr>
     <tr><td><b>الأسبوع 3</b></td><td>حل نماذج وتجميعات بوقت، وسجّل كل غلطة في دفتر مع القاعدة</td></tr>
     <tr><td><b>الأسبوع 4</b></td><td>راجع دفتر الأخطاء + اختبارين تجريبيين كاملين</td></tr></table></div>`},
   {t:'يوم الاختبار',b:`<ul>
     <li>نم زين، واحضر بدري، وجيب الهوية.</li>
     <li><b>لا تخلي سؤال بدون جواب</b>: لو ما عرفت، احذف الخيارات الغلط واختار.</li>
     <li>سؤال صعب؟ لا تعلق عنده، كمّل وارجع له إذا فيه وقت.</li></ul>`}
  ]}],

    [{ar:'اختار الصحيح:',en:'There ___ many people at the party.'},['was','is','were','has'],2,'There + فعل حسب اللي بعده: people جمع وماضي.'],
    [{ar:'اختار الصحيح:',en:'Neither the teacher nor the students ___ ready.'},['was','were','is','be'],1,'الفعل يتبع الأقرب: students جمع.'],
    [{ar:'اختار الصحيح:',en:'The box of apples ___ very heavy.'},['are','is','were','have'],1,'الفاعل box (مفرد)، وof apples مجرد وصف.'],
    [{ar:'اختار الصحيح:',en:'The report ___ by the manager yesterday.'},['wrote','was written','has write','writing'],1,'التقرير ما يكتب نفسه = مجهول ماضي: was + V3.'],

const PASSAGES = {
 sleep:`Many students stay up late before exams, but research shows this habit can hurt their results. During sleep, the brain organizes what we learned during the day and stores it in long-term memory. People who sleep well usually remember information better and solve problems faster. Even a short nap can improve attention. So, the best advice for students is simple: sleep well before an exam.`,
 plastic:`Plastic was once seen as a wonderful invention. It is cheap, light and strong, so it quickly became part of everyday life. However, these same qualities have created a serious problem. Because plastic is so durable, it can take hundreds of years to break down. Every year, millions of tons of it end up in the oceans, where it harms fish and birds. Some countries have started to charge customers for plastic bags, and the results have been encouraging: in several places, bag use dropped by more than half within a year. Experts say that such small steps, if they are widely adopted, can make a real difference.`
};
function speak(lines){
  try{const sy=window.speechSynthesis;if(!sy)return false;sy.cancel();
    const vs=sy.getVoices().filter(v=>/^en/i.test(v.lang));
    lines.forEach(([who,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;u.pitch=who==='w'?1.25:.85;
      if(vs.length){u.voice=vs[who==='w'?0:Math.min(1,vs.length-1)]}sy.speak(u)});return true}catch(e){return false}
}

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
const PRACTICE_DATA=(()=>{const r=rng(7);const reg=['الرياض','جدة','الدمام'],pr=[['لابتوب',3500],['جوال',2200],['شاشة',900],['سماعة',350]];const rows=[];
 for(let i=0;i<24;i++){const m=1+Math.floor(i/8),d=1+Math.floor(r()*28);const p=pr[Math.floor(r()*4)];
  rows.push({date:`2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,m,reg:reg[Math.floor(r()*3)],prod:p[0],qty:1+Math.floor(r()*5),price:p[1]})}
 rows.sort((a,b)=>a.date<b.date?-1:1);rows.forEach(x=>x.tot=x.qty*x.price);return rows})();
const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
function groupBy(f,v,agg='sum'){const m=new Map();PRACTICE_DATA.forEach(x=>{const k=f(x);const o=m.get(k)||{s:0,c:0};o.s+=v(x);o.c++;m.set(k,o)});return [...m].map(([k,o])=>[k,agg==='sum'?o.s:o.c])}
const miniTable=(rows,h)=>`<div class="scroll"><table class="grid"><tr><th>${h[0]}</th><th>${h[1]}</th></tr>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${fmt(b)}</td></tr>`).join('')}</table></div>`;

const KEYQ={};
Object.entries(SECTIONS).forEach(([sk,s])=>s.quizzes.forEach(qz=>qz.qs.forEach((d,i)=>KEYQ[qz.id+':'+i]={sec:sk,quiz:qz,d})));
function mkItem(key){const {d,sec,quiz}=KEYQ[key];const [q,opts,right,why]=d;
  const fixed=opts.every(o=>/^[A-D]$/.test(o))||opts.some(o=>/^\d-\d/.test(o));
  const ord=fixed?opts.map((_,i)=>i):shuffle(opts.map((_,i)=>i));
  return {key,sec,qz:quiz.title,q,opts:ord.map(i=>opts[i]),right:ord.indexOf(right),why,en:typeof q==='object'}}

function lessonTotals(key){const s=SECTIONS[key];let t=0,d=0;s.groups.forEach((g,gi)=>g.lessons.forEach((l,li)=>{t++;if(done[`${key}-${gi}-${li}`])d++}));return {t,d,p:t?Math.round(d/t*100):0}}
const mistakeCount=()=>Object.keys(mistakes).filter(k=>KEYQ[k]).length;
function navPaint(key){document.querySelectorAll('nav.main a').forEach(a=>{const h=a.getAttribute('href').slice(1);if(h===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});

function renderLessons(key,s,pane){
  const flat=[];
  pane.innerHTML=s.groups.map((g,gi)=>{const gd=g.lessons.filter((_,li)=>done[`${key}-${gi}-${li}`]).length;
   return `<h2 class="group-title">${g.title}<small>${gd} / ${g.lessons.length}</small></h2><div class="lessons">${
    g.lessons.map((l,li)=>{const id=`${key}-${gi}-${li}`;flat.push(id);return `<details class="lesson${done[id]?' done':''}" data-id="${id}" data-t="${esc(l.t)}">
      <summary><span class="n">${done[id]?'✓':li+1}</span><span class="t">${l.t}</span><span class="chev">‹</span></summary>
      <div class="lbody">${l.b}${l.x||''}${(l.f||[]).map(k=>FIG[k]).join('')}${l.s?src(l.s):''}
      <div class="lfoot"><button class="mark" type="button">${done[id]?'✓ فهمته':'فهمته'}</button><button class="nextl" type="button">الدرس التالي ←</button></div></div></details>`}).join('')
  }</div>${key==='excel'&&gi===1?pivotDemo():''}`}).join('');
  const all=[...pane.querySelectorAll('details.lesson')];
  all.forEach((d,i)=>{const id=d.dataset.id;
    d.addEventListener('toggle',()=>{if(d.open){last={sec:key,t:d.dataset.t};save()}});
    d.querySelector('.mark').onclick=()=>{done[id]=!done[id];save();d.classList.toggle('done',!!done[id]);d.querySelector('.mark').textContent=done[id]?'✓ فهمته':'فهمته';d.querySelector('.n').textContent=done[id]?'✓':(+id.split('-')[2]+1);updProg(key)};
    const nx=d.querySelector('.nextl');if(i===all.length-1){nx.textContent='روح للاختبارات ←';nx.onclick=()=>{tab[key]='quiz';section(key);scrollTo(0,0)}}
    else nx.onclick=()=>{if(!done[id]){done[id]=true;save();d.classList.add('done');d.querySelector('.mark').textContent='✓ فهمته';d.querySelector('.n').textContent='✓';updProg(key)}d.open=false;all[i+1].open=true;all[i+1].scrollIntoView({behavior:'smooth',block:'start'})};
  });
  if(key==='excel')bindPivot();
}

function pivotDemo(){
  return `<div class="demo"><h3>جرّب البيفوت بنفسك</h3>
  <p class="small" style="margin:0">يمين: البيانات الخام. يسار: البيفوت. غيّر الاختيارات وشوف كيف يتلخص الجدول.</p>
  <div class="row"><div class="col scroll"><table class="grid"><tr><th>المنطقة</th><th>المنتج</th><th>المبيعات</th></tr>
    ${PIVOT_DATA.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toLocaleString('en')}</td></tr>`).join('')}</table></div>
   <div class="col" style="display:grid;gap:10px"><div class="ctrls">
     <label for="pvRow">Rows (الصفوف)<select id="pvRow"><option value="0">المنطقة</option><option value="1">المنتج</option></select></label>
     <label for="pvAgg">Values (القيم)<select id="pvAgg"><option value="sum">مجموع المبيعات</option><option value="count">عدد الطلبات</option><option value="avg">متوسط المبيعات</option></select></label>
    </div><div class="scroll" id="pvOut"></div></div></div></div>`}
function bindPivot(){const r=document.getElementById('pvRow'),a=document.getElementById('pvAgg'),o=document.getElementById('pvOut');if(!r)return;
  const draw=()=>{const f=+r.value,ag=a.value,m=new Map();PIVOT_DATA.forEach(x=>{const k=x[f];const v=m.get(k)||{s:0,c:0};v.s+=x[2];v.c++;m.set(k,v)});
    const val=v=>ag==='sum'?v.s:ag==='count'?v.c:Math.round(v.s/v.c);const tot={s:0,c:0};m.forEach(v=>{tot.s+=v.s;tot.c+=v.c});
    const lbl={sum:'مجموع المبيعات',count:'عدد الطلبات',avg:'متوسط المبيعات'}[ag];
    o.innerHTML=`<table class="grid"><tr><th>${r.options[r.selectedIndex].text}</th><th>${lbl}</th></tr>${[...m].map(([k,v])=>`<tr><td>${k}</td><td>${val(v).toLocaleString('en')}</td></tr>`).join('')}<tr class="total"><td>الإجمالي الكلي</td><td>${val(tot).toLocaleString('en')}</td></tr></table>`};
  r.onchange=a.onchange=draw;draw()}

/* ================= مشغل الاختبار ================= */
let run=null;
function startRun(o){run={...o,items:o.keys.map(mkItem),n:0,score:0,picked:null,wrong:[]};renderRun();scrollTo(0,0)}
function stemHTML(it){const q=it.q;const pas=typeof q==='object'&&q.p?PASSAGES[q.p]:null,aud=typeof q==='object'&&q.a?q.a:null;
  const t=typeof q==='string'?esc(q):`${esc(q.ar)}${q.en?`<span class="en">${esc(q.en)}</span>`:''}`;
  return {aud,html:`${pas?`<div class="passage">${esc(pas)}</div>`:''}${aud?`<div class="ctrls"><button class="btn sm" id="play" type="button">▶ شغّل المقطع</button><button class="btn ghost sm" id="tr" type="button">اعرض النص</button></div><div class="passage" id="trx" hidden>${aud.map(([w,x])=>`<b>${w==='w'?'Woman':'Man'}:</b> ${esc(x)}`).join('<br>')}</div>`:''}<div class="qq">${t}</div>`}}
function bindAudio(aud){if(!aud)return;document.getElementById('play').onclick=()=>{if(!speak(aud))document.getElementById('trx').hidden=false};document.getElementById('tr').onclick=()=>{document.getElementById('trx').hidden=false}}
function renderRun(){
  const r=run,N=r.items.length;
  if(r.n>=N)return runResult();
  const it=r.items[r.n],st=stemHTML(it);
  app.innerHTML=`<section class="view" style="--sec:var(${r.color||'--accent'})">
   <div class="runhead"><button class="back" id="bk" type="button">→ رجوع</button><span class="small">${esc(r.title)}</span></div>
   <div class="quiz"><div class="qhead"><span class="tag">${r.review?esc(it.qz):'سؤال '+(r.n+1)+' من '+N}</span><span class="small">صح: ${r.score}${r.review?' · باقي '+(N-r.n):''}</span></div>
    <div class="meter"><span style="width:${r.n/N*100}%"></span></div>
    ${r.note&&r.n===0?`<p class="note">${r.note}</p>`:''}${st.html}
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${i+1}</span><span class="o${it.en?' en':''}">${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div></div></section>`;
  document.getElementById('bk').onclick=()=>{run=null;r.back()};
  bindAudio(st.aud);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){const r=run;if(!r||r.picked!=null)return;const it=r.items[r.n];r.picked=i;
  const btns=app.querySelectorAll('.opt');btns.forEach(x=>x.disabled=true);btns[it.right].classList.add('right');
  const ok=i===it.right;if(ok)r.score++;else{btns[i].classList.add('wrong');r.wrong.push({it,i})}
  stats.a++;if(ok){stats.c++;if(r.review)delete mistakes[it.key]}else mistakes[it.key]=1;save();
  const t=document.getElementById('trx');if(t)t.hidden=false;
  document.getElementById('fb').innerHTML=`<div class="explain"><b>${ok?'صح ✓':'الإجابة الصحيحة: '+esc(it.opts[it.right])}</b><br>${esc(it.why)}</div>
   <div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn" id="next" type="button">${r.n+1<r.items.length?'التالي':'شوف النتيجة'}</button><span class="hint">Enter</span></div>`;
  const nx=document.getElementById('next');nx.focus();nx.onclick=nextQ}
function nextQ(){if(!run)return;run.n++;run.picked=null;renderRun();scrollTo(0,0)}

  say(t,slow){if(!('speechSynthesis' in window)){toast('الصوت غير متاح في هذا الجهاز');return}
    speechSynthesis.cancel();const mk=voice=>{const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=slow?.55:.9;return u};

    app.innerHTML=`<section class="view" style="--sec:var(--gold)"><div class="runhead"><button class="back" id="vbk" type="button">→ رجوع</button><span class="small">كلمة ${n+1} من 10 · صح: ${score}</span></div>
     <div class="quiz"><div class="meter"><span style="width:${n*10}%"></span></div><div class="qq">وش معنى هذي الكلمة؟<span class="en" style="font-size:1.6rem;font-family:var(--f-display)">${esc(v[0])} <button class="spk ic" type="button" id="vqs" aria-label="استمع">🔊</button></span><span class="small" style="display:block;color:var(--sec)">${esc(v[3])}</span></div>
     <div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${i+1}</span><span class="o">${esc(o[1])}</span></button>`).join('')}</div><div id="fb"></div></div></section>`;
    document.getElementById('vbk').onclick=()=>vocabPage();document.getElementById('vqs').onclick=()=>TTS.say(v[0]);
    const bs=app.querySelectorAll('.opt');bs.forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];bs.forEach(x=>x.disabled=true);bs[opts.indexOf(v)].classList.add('right');
      if(o===v){score++;vknown[v[0]]=1}else{b.classList.add('wrong');wrong.push(v);delete vknown[v[0]]}save();
      document.getElementById('fb').innerHTML=`<div class="explain"><span class="en">${esc(v[2])}</span></div><div style="margin-top:12px"><button class="btn" id="vn" type="button">التالي</button></div>`;
      const nx=document.getElementById('vn');nx.focus();nx.onclick=()=>{n++;draw()}})};
  draw()}

/* ================= التطبيق العملي ================= */
function renderPractice(key,s,pane){
  if(key==='excel'){
    pane.innerHTML=`<div class="panel"><h3>1. انسخ البيانات والصقها في إكسل</h3>
     <p class="note">${PRACTICE_DATA.length} طلب مبيعات (التاريخ، المنطقة، المنتج، الكمية، السعر). افتح ملف إكسل جديد، اضغط على A1، والصق.</p>
     <div class="ctrls"><button class="btn" id="cp" type="button">انسخ البيانات</button><span class="small">بعد اللصق: الأعمدة من A إلى E والصفوف من 1 إلى ${PRACTICE_DATA.length+1}</span></div>
     <textarea class="raw" id="raw" hidden readonly aria-label="البيانات">${esc(PRACTICE_TSV)}</textarea></div>
     <div class="panel"><h3>2. سوّ المهام بالترتيب، وقارن نتيجتك بالحل</h3>
     ${excelTasks().map(([q,a],i)=>`<div class="task"><span class="num">${i+1}</span><div><span>${q}</span><details><summary>اعرض الحل</summary><div>${a}</div></details></div></div>`).join('')}</div>`;
    const raw=document.getElementById('raw');document.getElementById('cp').onclick=()=>copyText(PRACTICE_TSV,raw);
  } else {
    pane.innerHTML=[['wd','تمرين وورد: سوّ تقرير مرتب','--wd'],['pp','تمرين بوربوينت: سوّ عرض من 5 شرائح','--pp']].map(([k,t,c])=>{const d=OFFICE_TASKS[k].filter((_,i)=>checks[k+i]).length;
     return `<div class="panel" style="--sec:var(${c})"><h3>${t}</h3><div class="tprog" style="margin:0"><div class="meter"><span style="width:${d/OFFICE_TASKS[k].length*100}%"></span></div><span class="small">${d} من ${OFFICE_TASKS[k].length}</span></div>
      ${OFFICE_TASKS[k].map((x,i)=>`<label class="check${checks[k+i]?' on':''}"><input type="checkbox" data-c="${k+i}" ${checks[k+i]?'checked':''}><span>${x}</span></label>`).join('')}</div>`}).join('');
    pane.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{if(c.checked)checks[c.dataset.c]=1;else delete checks[c.dataset.c];save();renderPractice(key,s,pane)});
  }
}
function renderCheat(key,s,pane){pane.innerHTML=`<p class="note">كل المسار في صفحة وحدة. ارجع لها قبل الاختبار أو وقت ما تنسى شي.</p><div class="cheats">${CHEATS[key].map(([t,h])=>`<div class="cheat"><h3>${t}</h3>${h}</div>`).join('')}</div>`}
function renderRefs(key,s,pane){
  const path=s.path?`<div class="howto"><b>السلسلة المقترحة: امشِ عليها بالترتيب</b><ol>${s.path.map(([a,b])=>`<li><b>${a}:</b> ${b}</li>`).join('')}</ol></div>`:'';
  pane.innerHTML=path+`<p class="note">اخترنا مراجع معروفة ويشيد فيها المتعلمين، أغلبها مجاني.</p>
  <div class="refs">${s.refs.map(r=>`<div class="ref"><a href="${r.u}" target="_blank" rel="noopener">${r.n} ↗</a><p>${r.d}</p><div class="chips">${r.c.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div>`).join('')}</div>`}

/* ================= التوجيه ================= */
function route(){
  const h=(location.hash||'#home').slice(1);
  if(h!=='mock'&&mock){/* يبقى الاختبار شغال لو رجع */}
  run=null;
  const pages={home,mock:mockPage,review:reviewPage,vocab:vocabPage};
  const key=SECTIONS[h]?h:(pages[h]?h:'home');
  navPaint(key);
  if(SECTIONS[key]){last=last&&last.sec===key?last:{sec:key};save();section(key)}else pages[key]();
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();

</script>
